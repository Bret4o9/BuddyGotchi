<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="leaflet.min.css" />
  <script src="leaflet.min.js"></script>
  <style>
    html, body, #map {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      overflow: hidden;
    }
    .leaflet-container {
      background: #121212 !important;
    }
    .leaflet-control-attribution {
      display: none !important;
    }
    /* Nothing OS Dark Mode Tile Filter */
    .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.2) brightness(0.75);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map', {
      center: [42.6977, 23.3219],
      zoom: 15,
      zoomControl: false,
      attributionControl: false
    });

    var tileLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    });
    tileLayer.on('tileload', function() { console.log('OSM Tile loaded successfully'); });
    tileLayer.on('tileerror', function(err) { console.error('OSM Tile error: ' + JSON.stringify(err)); });
    tileLayer.addTo(map);

    map.on('moveend', function() {
      var c = map.getCenter();
      if (window.AndroidBridge && window.AndroidBridge.onMapIdle) {
        window.AndroidBridge.onMapIdle(c.lat, c.lng, map.getZoom());
      }
    });

    function initMap(lat, lng, zoom) {
      map.setView([lat, lng], zoom || 15);
      map.invalidateSize();
      setTimeout(function() {
        map.invalidateSize();
      }, 200);
    }

    setTimeout(function() {
      map.invalidateSize();
    }, 150);

    function setCenter(lat, lng, zoom) {
      map.setView([lat, lng], zoom || map.getZoom());
    }

    function zoomIn() {
      map.zoomIn();
    }

    function zoomOut() {
      map.zoomOut();
    }
  </script>
</body>
</html>
